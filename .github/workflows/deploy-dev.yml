# Deploy to DEV and INT on every push to the dev branch.

name: Deploy to Dev

on:
    push:
        branches:
            - dev
    workflow_dispatch:
        inputs:
            full:
                description: 'Deploy all metadata (skip delta)'
                type: boolean
                default: false
            import_data:
                description: 'Import TPM template data after deploy'
                type: boolean
                default: false
            delete_old_data:
                description: 'Delete old data before importing (clean import)'
                type: boolean
                default: false

concurrency:
    group: deploy-dev
    cancel-in-progress: false

permissions:
    contents: read
    actions: read
    pull-requests: read

jobs:
    admin-guard:
        if: github.event_name == 'push'
        uses: ./.github/workflows/admin-guard.yml

    deploy-dev:
        needs: admin-guard
        if: always() && (needs.admin-guard.result == 'success' || needs.admin-guard.result == 'skipped')
        uses: ./.github/workflows/sf-deploy.yml
        with:
            org_name: DEV
            org_alias: dev
            environment: dev
            full: ${{ inputs.full == true }}
            ignore_deploy_errors: true
            import_data: ${{ inputs.import_data == true }}
            delete_old_data: ${{ inputs.delete_old_data == true }}
        secrets: inherit

    deploy-int:
        needs: admin-guard
        if: always() && (needs.admin-guard.result == 'success' || needs.admin-guard.result == 'skipped')
        uses: ./.github/workflows/sf-deploy.yml
        with:
            org_name: INT
            org_alias: int
            environment: int
            full: ${{ inputs.full == true }}
            ignore_deploy_errors: true
            import_data: ${{ inputs.import_data == true }}
            delete_old_data: ${{ inputs.delete_old_data == true }}
        secrets: inherit

    notify:
        needs: [admin-guard, deploy-dev, deploy-int]
        if: >-
            always() &&
            needs.deploy-dev.outputs.skip_notify != 'true' &&
            (needs.admin-guard.result == 'failure' || needs.deploy-dev.result != 'skipped')
        uses: ./.github/workflows/slack-notify.yml
        with:
            workflow_name: Deploy to Dev
            result: ${{ (needs.deploy-dev.result == 'failure' || needs.deploy-int.result == 'failure') && 'failure' || 'success' }}
        secrets:
            SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
            SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
